<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>구매 물품 리스트</title>
</head>

<body>

    <h1>구매 물품 리스트</h1>
    <h2>물품 추가</h2>
    <input type="text" id="name" placeholder="물품 이름">
    <input type="text" id="category" placeholder="카테고리">
    <input type="text" id="quantity" placeholder="수량">
    <select id="status">
        <option value="">구매 여부 선택</option>
        <option value="구매 예정">구매 예정</option>
        <option value="구매 완료">구매 완료</option>
    </select>
    <button id="addbtn">Add</button>

    <h2>구매 물품 목록</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>물품 이름</th>
                <th>카테고리</th>
                <th>수량</th>
                <th>구매 여부</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="list">
        </tbody>
    </table>
</body>
<script>
    let items = [
        {
            id:1,
            name:"우유",
            category:"식품",
            quantity:2,
            status:"구매 예정"
        },
        {
            id:2,
            name:"샴푸",
            category:"생활용품",
            quantity:1,
            status:"구매 예정"
        },
        {
            id:3,
            name:"노트",
            category:"문구",
            quantity:3,
            status:"구매 완료"
        }
    ];

    function render(){
        const itemList=document.querySelector("#itemList");
        itemList.innerHTML="";
        item.forEach(function(item){
            const tr=document.createElement("tr");
            tr.innerHTML=`
                <td>${item.id}</td>
                <td>${item.name}</td>
                <td>${item.category}</td>
                <td>${item.quantity}</td>
                <td>${item.status}</td>
                <td></td>
            `;
            itemList.appendChild(tr);
        })
    }
    render();
</script>
</html>
