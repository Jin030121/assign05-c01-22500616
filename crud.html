<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>구매 물품 리스트</title>
</head>

<body>

    <h1>구매 물품 리스트</h1>
    <h2>물품 추가</h2>
    <input type="text" id="name" placeholder="물품 이름">
    <input type="text" id="category" placeholder="카테고리">
    <input type="text" id="quantity" placeholder="수량">
    <select id="status">
        <option value="">구매 여부 선택</option>
        <option value="구매 예정">구매 예정</option>
        <option value="구매 완료">구매 완료</option>
    </select>
    <button id="addbtn">Add</button>

    <h2>구매 물품 목록</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>물품 이름</th>
                <th>카테고리</th>
                <th>수량</th>
                <th>구매 여부</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="itemList">
        </tbody>
    </table>
</body>
<script>
    let editId = null;
    let items = [
        {
            id:1,
            name:"우유",
            category:"식품",
            quantity:2,
            status:"구매 예정"
        },
        {
            id:2,
            name:"샴푸",
            category:"생활용품",
            quantity:1,
            status:"구매 예정"
        },
        {
            id:3,
            name:"노트",
            category:"문구",
            quantity:3,
            status:"구매 완료"
        }
    ];

    function render(){
        const itemList=document.querySelector("#itemList");
        itemList.innerHTML="";
        items.forEach(function(item){
            const tr=document.createElement("tr");
            tr.innerHTML=`
                <td>${item.id}</td>
                <td>${item.name}</td>
                <td>${item.category}</td>
                <td>${item.quantity}</td>
                <td>${item.status}</td>
                <td>
                    <button onclick="editItem(${item.id})">수정</button>
                </td>
            `;
            itemList.appendChild(tr);
        })  
    }

    function editItem(id){
        editId = id;
        const item = items.find(function(item){
            return item.id === id;
        })
        document.querySelector("#name").value = item.name;
        document.querySelector("#category").value = item.category;
        document.querySelector("#quantity").value = item.quantity;
        document.querySelector("#status").value = item.status;
    }

    const addbtn=document.querySelector("#addbtn");
    addbtn.addEventListener("click",function(){
        const name=document.querySelector("#name").value;
        const category=document.querySelector("#category").value;
        const quantity=document.querySelector("#quantity").value;
        const status=document.querySelector("#status").value;
        
        if(editId !== null){
            const item = items.find(function(item){
                return item.id === editId;
            });
            item.name = name;
            item.category = category;
            item.quantity = quantity;
            item.status = status;
            editId = null;
        }
        else{
            const newItem={
                id:items.length+1,
                name:name,
                category:category,
                quantity:quantity,
                status:status
            };
            
            items.push(newItem);
        }
            document.querySelector("#name").value="";
            document.querySelector("#category").value="";
            document.querySelector("#quantity").value="";
            document.querySelector("#status").value="";
            render();
    });
    render();
</script>
</html>
